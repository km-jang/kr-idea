name: 배포 점검

# ── 배포 안전벨트 (2026-09-01 신설) ────────────────────────────────────────────
# 사고 2(7/31 붙여넣기 SyntaxError)와 사고 6(8/31 KST NameError)은 둘 다
# "올린 직후 전면 중단"이었고, 둘 다 단위 테스트 114/114를 통과한 상태였다.
# 단위 테스트는 함수를 조각으로 검사할 뿐 실제 실행 경로를 안 밟기 때문이다.
# 그래서 .py 파일을 올릴 때마다 진짜 진입점을 dry-run으로 한 번씩 밟아본다.
# 검증: 8/31 09:37 배포본(f9c63ba)을 이 검사에 넣으면 2단계에서 NameError로 차단된다.
#
# update.yml과 일부러 파일을 나눴다. 같은 파일에 넣으면 update.yml의
# concurrency(update-data) 자리를 점검이 차지해, 마침 그때 도착한 수집·발송이
# 뒤로 밀리거나 취소될 수 있다. 이 파일을 update.yml에 합치지 말 것.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
    paths:                       # 봇이 올리는 data.json·ops.json·sent_log.json은 해당 없음
      - '**.py'
      - 'requirements.txt'
      - '.github/workflows/*.yml'
  workflow_dispatch: {}

permissions:
  contents: read                 # 읽기만 한다. 이 워크플로는 저장소에 아무것도 쓰지 않는다

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true       # 연속 업로드 시 마지막 것만 검사하면 된다

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 0) 문법 검사 (전체 .py)
        shell: bash
        run: |
          # 사고 2(붙여넣기 SyntaxError)를 30초 안에 잡는 자리. 네트워크·의존성 불필요
          python -m compileall -q . 2>&1 | tee -a smoke_log.txt
          exit ${PIPESTATUS[0]}

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 1) 단위 테스트
        shell: bash
        run: |
          python test_parsers.py 2>&1 | tee -a smoke_log.txt
          exit ${PIPESTATUS[0]}

      - name: 2) 발송 진입점 실제 실행 (dry-run - 텔레그램 발송 없음)
        shell: bash
        run: |
          # 사고 6이 잡히는 자리.
          # 이 단계만 외부 시세를 부르므로, 일시적 네트워크 오류를 코드 결함으로
          # 오인해 헛경보를 내지 않도록 2번까지 재시도한다 (사고 1의 교훈).
          fail=0
          for M in "" "--evening" "--weekly"; do
            ok=0
            for try in 1 2; do
              echo "── notify.py $M --dry-run (시도 $try)" | tee -a smoke_log.txt
              if python notify.py $M --dry-run >> smoke_log.txt 2>&1; then ok=1; break; fi
              echo "   실패 - 20초 후 재시도" | tee -a smoke_log.txt; sleep 20
            done
            [ "$ok" = 1 ] || fail=1
          done
          exit $fail

      - name: 3) 스캔·맥박 메시지 조립 (시각 고정 - 시간 창 가드 우회)
        shell: bash
        run: |
          python - <<'EOF' 2>&1 | tee -a smoke_log.txt
          import json, datetime, closing_scan as c
          now = datetime.datetime(2026, 1, 5, 12, 6, tzinfo=c.KST)   # 평일 장중으로 고정
          data = json.load(open("data.json", encoding="utf-8"))
          assert c.build_pulse_message(data, {}, now=now)
          assert c.build_scan_message([], now=now, dumps=[])
          print("스캔·맥박 메시지 조립 OK")
          EOF

      - name: 4) 성적표 기록 로직
        shell: bash
        run: |
          python - <<'EOF' 2>&1 | tee -a smoke_log.txt
          import json, ops_log
          r = ops_log.build_record(
              json.load(open("data.json", encoding="utf-8")),
              json.load(open("sent_log.json", encoding="utf-8")),
              json.load(open("scans.json", encoding="utf-8")),
              "2026-01-05")
          assert set(r) >= {"date", "data_final", "morning", "pulse", "evening", "scan"}
          print("성적표 기록 로직 OK")
          EOF

      - name: 5) 날짜 계산 일치 확인 (B안 재발 방지)
        shell: bash
        # B안(2026-09-22) 적용으로 실패 허용(continue-on-error)을 뺐다. 이제 어긋나면 깨짐 통보가 간다.
        # 예전 점검은 notify의 옛 계산식을 여기 베껴 두고 비교했다. 지금은 실제 함수를 부른다.
        run: |
          python - <<'EOF' 2>&1 | tee -a smoke_log.txt
          import os, datetime
          import ops_log, closing_scan, holidays_kr, notify
          os.environ.pop("KR_BASE_DAY", None)
          # 실사고 재현: 8/31 저녁 작업이 9/1 03:03 KST에 실행됨. 네 모듈이 전부 8/31로 세야 한다
          dawn = datetime.datetime(2026, 9, 1, 3, 3, tzinfo=ops_log.KST)
          got = {"ops_log": ops_log.base_day(dawn), "closing_scan": closing_scan.base_day(dawn),
                 "holidays_kr": holidays_kr.base_day(dawn), "notify": notify.kst_today(dawn)}
          print("같은 순간을 각 모듈이 센 날짜:", got)
          assert set(got.values()) == {"2026-08-31"}, "모듈마다 다른 날로 센다"
          # 워크플로가 정한 기준일을 인자 없는 경로가 따르는가 (금요일 몫 복구가 토요일 새벽에 돌 때)
          os.environ["KR_BASE_DAY"] = "2026-09-18"
          assert notify.kst_today() == "2026-09-18", notify.kst_today()
          assert holidays_kr.closed_reason() is None, "금요일 몫인데 휴장으로 판정"
          # 새벽 복구 수집도 전날 마감분으로 센다
          assert ops_log.is_final({"market_date": "2026-08-31", "generated_at": "2026-09-01 03:10 KST"},
                                  "2026-08-31"), "새벽 복구 수집을 미반영으로 판정"
          print("날짜 계산 일치 OK")
          EOF

      - name: 결과 통보
        # 취소된 점검(연속 업로드로 다음 커밋에 밀린 것)은 통보하지 않는다 (2026-09-14 헛경보 수정).
        # always()였을 때는 취소도 "깨졌습니다"로 나갔다. 마지막 커밋의 점검만 ✅/⛔를 보낸다.
        if: ${{ !cancelled() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then echo "시크릿 없음 - 통보 생략"; exit 0; fi
          if [ "${{ job.status }}" = "success" ]; then
            MSG="✅ 배포 점검 통과 - 방금 올린 파일이 실행 단계까지 정상입니다"
          else
            TAILT=$(tail -n 10 smoke_log.txt 2>/dev/null | tail -c 900)
            MSG="⛔ 방금 올린 파일이 실행 단계에서 깨졌습니다 - 되돌리세요
          [오류 마지막 줄]
          ${TAILT:-로그 없음}
          되돌리는 법: 아래 링크 → 오른쪽 위 ... → Revert
          https://github.com/${{ github.repository }}/commit/${{ github.sha }}"
          fi
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" --data-urlencode text="$MSG" > /dev/null || true
